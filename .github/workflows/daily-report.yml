name: End-of-Shift Daily Report

on:
  schedule:
    # 6:00 PM CT (CDT=UTC-5) = 23:00 UTC same day
    - cron: '0 23 * * 1'   # Monday    CT
    - cron: '0 23 * * 2'   # Tuesday   CT
    - cron: '0 23 * * 3'   # Wednesday CT
    - cron: '0 23 * * 4'   # Thursday  CT
    - cron: '0 23 * * 5'   # Friday    CT
    - cron: '0 23 * * 6'   # Saturday  CT
    # 6:00 PM CT (CST=UTC-6) = 00:00 UTC next day
    - cron: '0 0 * * 2'    # Monday    CT (CST)
    - cron: '0 0 * * 3'    # Tuesday   CT (CST)
    - cron: '0 0 * * 4'    # Wednesday CT (CST)
    - cron: '0 0 * * 5'    # Thursday  CT (CST)
    - cron: '0 0 * * 6'    # Friday    CT (CST)
    - cron: '0 0 * * 0'    # Saturday  CT (CST)

  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date (YYYY-MM-DD). Leave empty for today CT.'
        required: false
        default: ''
      force_resend:
        description: 'Resend even if already sent (true/false)'
        required: false
        default: 'false'

jobs:
  daily-report:
    name: Generate Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Restore DB cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ./data/bot.sqlite
          key: bot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bot-db-${{ runner.os }}-

      - name: Create data dirs
        run: mkdir -p data/recordings data/logs

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ANALYSIS_MODEL: gpt-4o-mini
          OPENAI_TRANSCRIPTION_MODEL: gpt-4o-mini-transcribe
          RC_SERVER_URL: https://platform.ringcentral.com
          RC_CLIENT_ID: ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT: ${{ secrets.RC_JWT }}
          DATABASE_PATH: ./data/bot.sqlite
          DOWNLOAD_DIR: ./data/recordings
          RC_REQUESTS_PER_MINUTE: '4'
          RC_PER_PAGE: '100'
          RC_MAX_PAGES: '10'
          MIN_CALL_DURATION_SECONDS: '60'
          MAX_AUDIO_MB: '25'
          DEBUG_MODE: 'false'
          GH_ACTIONS_MODE: 'true'
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          GH_USERS: ${{ secrets.GH_USERS }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
          FORCE_RESEND: ${{ github.event.inputs.force_resend }}
        run: node scripts/gh-daily.js

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./data/bot.sqlite
          key: bot-db-${{ runner.os }}-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: ./data/logs/
          if-no-files-found: ignore
          retention-days: 3
