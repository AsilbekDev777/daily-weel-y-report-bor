  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'poll'
        type: choice
        options:
          - poll
          - backfill

jobs:
  poll-calls:
    name: Poll and Analyze Calls
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Restore DB cache
        uses: actions/cache/restore@v4
        with:
          path: ./data/bot.sqlite
          restore-keys: |
            bot-db-

      - name: Create data dirs
        run: mkdir -p data/recordings data/logs

      - name: Run poll
        if: github.event_name == 'schedule' || github.event.inputs.mode == 'poll'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ANALYSIS_MODEL: gpt-4o-mini
          OPENAI_TRANSCRIPTION_MODEL: gpt-4o-mini-transcribe
          RC_SERVER_URL: https://platform.ringcentral.com
          RC_CLIENT_ID: ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT: ${{ secrets.RC_JWT }}
          DATABASE_PATH: ./data/bot.sqlite
          DOWNLOAD_DIR: ./data/recordings
          LOOKBACK_MINUTES: '45'
          MAX_ANALYZE_PER_SYNC: '4'
          MIN_CALL_DURATION_SECONDS: '15'
          MAX_AUDIO_MB: '25'
          RC_REQUESTS_PER_MINUTE: '4'
          RC_PER_PAGE: '100'
          RC_MAX_PAGES: '10'
          OPENAI_DELAY_MS: '5000'
          DEBUG_MODE: 'false'
          GH_ACTIONS_MODE: 'true'
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
        run: node scripts/gh-poll.js

      - name: Run backfill
        if: github.event.inputs.mode == 'backfill'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ANALYSIS_MODEL: gpt-4o-mini
          OPENAI_TRANSCRIPTION_MODEL: gpt-4o-mini-transcribe
          RC_SERVER_URL: https://platform.ringcentral.com
          RC_CLIENT_ID: ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT: ${{ secrets.RC_JWT }}
          DATABASE_PATH: ./data/bot.sqlite
          DOWNLOAD_DIR: ./data/recordings
          LOOKBACK_MINUTES: '45'
          MAX_ANALYZE_PER_SYNC: '10'
          MIN_CALL_DURATION_SECONDS: '15'
          MAX_AUDIO_MB: '25'
          RC_REQUESTS_PER_MINUTE: '4'
          RC_PER_PAGE: '100'
          RC_MAX_PAGES: '10'
          OPENAI_DELAY_MS: '5000'
          DEBUG_MODE: 'true'
          GH_ACTIONS_MODE: 'true'
          BACKFILL_DAYS: '7'
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
        run: node scripts/gh-poll.js --backfill

      - name: Save DB cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: ./data/bot.sqlite
          key: bot-db-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: poll-logs-${{ github.run_id }}
          path: ./data/logs/
          retention-days: 3
