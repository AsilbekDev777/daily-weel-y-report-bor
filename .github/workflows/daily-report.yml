name: End-of-Shift Daily Report

on:
  schedule:
    # 7:00 PM CT (CDT=UTC-5) = 00:00 UTC (next day)
    - cron: '0 0 * * 2'   # Monday    CT → Tuesday    00:00 UTC
    - cron: '0 0 * * 3'   # Tuesday   CT → Wednesday  00:00 UTC
    - cron: '0 0 * * 4'   # Wednesday CT → Thursday   00:00 UTC
    - cron: '0 0 * * 5'   # Thursday  CT → Friday     00:00 UTC
    - cron: '0 0 * * 6'   # Friday    CT → Saturday   00:00 UTC
    - cron: '0 0 * * 0'   # Saturday  CT → Sunday     00:00 UTC
    # 7:00 PM CT (CST=UTC-6) = 01:00 UTC (next day)
    - cron: '0 1 * * 2'
    - cron: '0 1 * * 3'
    - cron: '0 1 * * 4'
    - cron: '0 1 * * 5'
    - cron: '0 1 * * 6'
    - cron: '0 1 * * 0'

  workflow_dispatch:
    inputs:
      date_override:
        description: 'Date (YYYY-MM-DD). Leave empty for today CT.'
        required: false
        default: ''

jobs:
  daily-report:
    name: Generate Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Restore DB cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ./data/bot.sqlite
          key: bot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bot-db-${{ runner.os }}-

      - name: Create data dirs
        run: mkdir -p data/recordings data/logs

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ANALYSIS_MODEL: gpt-4o-mini
          RC_SERVER_URL: https://platform.ringcentral.com
          RC_CLIENT_ID: ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT: ${{ secrets.RC_JWT }}
          DATABASE_PATH: ./data/bot.sqlite
          DOWNLOAD_DIR: ./data/recordings
          RC_REQUESTS_PER_MINUTE: '4'
          RC_PER_PAGE: '100'
          RC_MAX_PAGES: '10'
          MIN_CALL_DURATION_SECONDS: '15'
          DEBUG_MODE: 'false'
          GH_ACTIONS_MODE: 'true'
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          GH_USERS: ${{ secrets.GH_USERS }}
          FORCE_RESEND: ${{ github.event.inputs.force_resend }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override }}
        run: node scripts/gh-daily.js

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./data/bot.sqlite
          key: bot-db-${{ runner.os }}-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: daily-logs-${{ github.run_id }}
          path: ./data/logs/
          if-no-files-found: ignore
          retention-days: 3
