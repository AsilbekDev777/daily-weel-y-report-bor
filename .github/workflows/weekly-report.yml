name: Weekly Performance Report

on:
  schedule:
    # Saturday 6:05 PM CT (CDT=UTC-5) = Saturday 23:05 UTC
    - cron: '5 23 * * 6'
    # Saturday 6:05 PM CT (CST=UTC-6) = Sunday 00:05 UTC
    - cron: '5 0 * * 0'

  workflow_dispatch:
    inputs:
      week_start:
        description: 'Week start (YYYY-MM-DD, Monday). Leave empty for auto.'
        required: false
        default: ''
      week_end:
        description: 'Week end (YYYY-MM-DD, Saturday). Leave empty for auto.'
        required: false
        default: ''
      force_resend:
        description: 'Resend even if already sent (true/false)'
        required: false
        default: 'false'

jobs:
  weekly-report:
    name: Generate Weekly Report
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Restore DB cache
        id: restore-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ./data/bot.sqlite
          key: bot-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bot-db-${{ runner.os }}-

      - name: Create data dirs
        run: mkdir -p data/recordings data/logs

      - name: Run weekly report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_ANALYSIS_MODEL: gpt-4o-mini
          OPENAI_TRANSCRIPTION_MODEL: gpt-4o-mini-transcribe
          RC_SERVER_URL: https://platform.ringcentral.com
          RC_CLIENT_ID: ${{ secrets.RC_CLIENT_ID }}
          RC_CLIENT_SECRET: ${{ secrets.RC_CLIENT_SECRET }}
          RC_JWT: ${{ secrets.RC_JWT }}
          DATABASE_PATH: ./data/bot.sqlite
          DOWNLOAD_DIR: ./data/recordings
          RC_REQUESTS_PER_MINUTE: '4'
          RC_PER_PAGE: '100'
          RC_MAX_PAGES: '10'
          MIN_CALL_DURATION_SECONDS: '60'
          MAX_AUDIO_MB: '25'
          DEBUG_MODE: 'false'
          GH_ACTIONS_MODE: 'true'
          ADMIN_TELEGRAM_IDS: ${{ secrets.ADMIN_TELEGRAM_IDS }}
          GH_USERS: ${{ secrets.GH_USERS }}
          WEEK_START_OVERRIDE: ${{ github.event.inputs.week_start }}
          WEEK_END_OVERRIDE: ${{ github.event.inputs.week_end }}
          FORCE_RESEND: ${{ github.event.inputs.force_resend }}
        run: node scripts/gh-weekly.js

      - name: Save DB cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ./data/bot.sqlite
          key: bot-db-${{ runner.os }}-${{ github.run_id }}

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-logs-${{ github.run_id }}
          path: ./data/logs/
          if-no-files-found: ignore
          retention-days: 3
